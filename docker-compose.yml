services:
  agendador-tarefas:
    build: ../agendador-tarefas
    container_name: agendador-tarefas
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATA_MONGO_DB=mongodb://mongo:27017/db_agendador
    depends_on:
      - mongo
  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador
    ports:
      - "8083:8083"
    environment:
      - USUARIO_URL=usuario:8080
      - AGENDADOR_TAREFAS_URL=agendador-tarefas:8081
      - NOTIFICACAO_URL=notificacao:8082
  usuario:
    build: ../usuario
    container_name: usuario
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATABASE_URL=jdbc:postgresql://postgres:5432/db_usuario
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
    depends_on:
      - postgres
  notificacao:
    build: ../notificacao
    container_name: notificacao
    ports:
      - "8082:8082"
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=db_usuario
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=db_agendador
networks:
  default:
    driver: bridge
